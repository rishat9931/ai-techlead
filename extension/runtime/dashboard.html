<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стендап команды</title>
<style>
:root{
  --bg:#f4f6fa;--card:#ffffff;--ink:#17203a;--muted:#5b6579;--line:#e3e8f0;
  --accent:#1a4fd6;--accent-soft:#e8eeff;--ok:#188042;--ok-soft:#e3f4ea;
  --warn:#b26a00;--warn-soft:#fff3dd;--bad:#c5221f;--bad-soft:#fdebea;
  --radius:12px;--shadow:0 1px 3px rgba(23,32,58,.08),0 4px 14px rgba(23,32,58,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.45}
.wrap{max-width:1220px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:14px}
header.top h1{font-size:22px;letter-spacing:.2px}
header.top .sub{color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.pill.red{background:var(--bad-soft);color:var(--bad)}
.pill.yellow{background:var(--warn-soft);color:var(--warn)}
.pill.green{background:var(--ok-soft);color:var(--ok)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;font-weight:600}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:15.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal{font-size:14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;white-space:pre-line}
.progress{height:10px;border-radius:999px;background:#eef1f7;overflow:hidden;margin:10px 0 6px;position:relative}
.progress .done{position:absolute;top:0;bottom:0;left:0;background:var(--ok)}
.progress .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid #eef1f7;vertical-align:top}
tr:last-child td{border-bottom:none}
.tblscroll{overflow-x:auto}
tr.row-bad td{background:var(--bad-soft)}
tr.row-warn td{background:var(--warn-soft)}
.num{text-align:right}
.bdg{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.bdg.done{background:var(--ok-soft);color:var(--ok)}
.bdg.wip{background:var(--accent-soft);color:var(--accent)}
.bdg.todo{background:#eef1f7;color:var(--muted)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.rel{padding:10px 0;border-top:1px solid #eef1f7}
.rel:first-of-type{border-top:0}
.rel .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.stagecol{background:#f8fafd;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.stagecol h4{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:6px;align-items:center;line-height:1.3}
.stagecol h4 span{white-space:nowrap}
.relcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;overflow-wrap:anywhere}
.relcard:last-child{margin-bottom:0}
.relcard .k{font-weight:600;white-space:nowrap}
.relcard small{color:var(--muted);display:block;margin-top:3px;font-size:11.5px}
.relcard.final{border-left-color:var(--ok)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.banner{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.banner.bad{background:var(--bad-soft);border:1px solid #f3c2bf;color:#7f1d1a}
.banner.warn{background:var(--warn-soft);border:1px solid #ecd9ae;color:#6b4c00}
.banner.info{background:var(--accent-soft);border:1px solid #c9d8ff;color:#12379b}
ul.clean{list-style:none}
ul.clean li{padding:6px 0;border-bottom:1px dashed #eef1f7;font-size:13px}
ul.clean li:last-child{border-bottom:none}
.timeline .t-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed #eef1f7;font-size:13px;align-items:flex-start}
.timeline .t-item:last-child{border-bottom:none}
.t-date{min-width:86px;color:var(--muted);font-size:12px;padding-top:1px}
footer{color:var(--muted);font-size:12px;margin-top:18px;display:flex;gap:14px;flex-wrap:wrap}
.count{font-size:11px;background:#eef1f7;border-radius:999px;padding:1px 8px;color:var(--muted)}
.sources{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.partial{background:var(--warn)}
select,.btn{font:13px -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.copied{border-color:var(--ok);color:var(--ok)}
.recg{display:grid;grid-template-columns:170px 1fr 120px;gap:12px;padding:10px 0;border-top:1px solid #eef1f7;font-size:13px}
.recg:first-of-type{border-top:0}
.recg .why{grid-column:2/4;color:var(--muted);font-size:12.5px;margin-top:-6px}
.sig{font:12.5px/1.4 ui-monospace,"SF Mono",Menlo,monospace;word-break:break-word}
.cluster{border-top:1px solid #eef1f7;padding:14px 0}
.cluster:first-of-type{border-top:0}
.cluster summary{cursor:pointer;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;list-style:none}
.cluster summary::-webkit-details-marker{display:none}
.cluster .body{margin-top:10px;padding-left:14px;border-left:2px solid var(--line)}
pre{background:#f2f4f9;padding:10px 12px;border-radius:8px;overflow-x:auto;font-size:12px;margin:8px 0}
.bugdraft{background:var(--bg);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:13px}
.cov{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.cov .bar{height:8px;border-radius:999px;background:#eef1f7;overflow:hidden;position:relative}
.cov .bar i{position:absolute;inset:0 auto 0 0;background:var(--cv)}
.cov .bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn)}
.issues{color:var(--warn);font-size:12.5px;margin-top:4px}
.task{display:flex;gap:10px;align-items:baseline;padding:2px 0;font-size:13px}
.task .key{font-weight:600;white-space:nowrap}
.task .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-work{color:var(--bad);font-weight:600;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
[hidden]{display:none!important}
@media (max-width:760px){
  body{padding:12px}
  .recg{grid-template-columns:1fr;gap:2px}
  .recg .why{grid-column:1;margin-top:0}
  .tblscroll{overflow-x:auto}
}
@media (prefers-reduced-motion: no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1 id="ptitle">Стендап</h1>
    <span class="pill" id="levelPill" hidden></span>
    <span class="pill" id="sprintPill" hidden></span>
    <span class="sub" id="psub"></span>
    <span style="flex:1"></span>
    <span class="sub" id="collected"></span>
  </header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="content"></main>
  <footer id="foot"></footer>
</div>

<script src="reports/latest.js"></script>
<script>
(function () {
  const R = window.REPORT, T = window.TESTS_REPORT || null;
  const content = document.getElementById('content');
  const foot = document.getElementById('foot');

  // ---------- утилиты ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = d => d ? new Date(d).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) : '—';
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
  const days = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
  // ссылки из данных — только http(s), иначе ссылку не рисуем
  const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u.trim()) ? u.trim() : '');
  const link = (u, inner, attrs = '') => { const h = safeUrl(u); return h ? `<a ${attrs}href="${esc(h)}">${inner}</a>` : `<span ${attrs}>${inner}</span>`; };
  const isNum = n => typeof n === 'number' && isFinite(n);
  const LEVEL = { red: ['Красный', 'red'], yellow: ['Жёлтый', 'yellow'], green: ['Зелёный', 'green'] };
  const ROLE = { dev: 'разработка', qa: 'тестирование', aqa: 'автотесты', analyst: 'аналитика' };
  const SRC = { jira: 'Jira', bitbucket: 'Bitbucket', jenkins: 'Jenkins', testops: 'TestOps' };
  const JOB_STATE = {
    ok: ['работает', 'done'],
    failed_before_tests: ['упала до тестов', 'bad'],
    hung: ['зависла', 'bad'],
    idle: ['давно не запускалась', 'warn']
  };
  const kpi = (k, v, s, cls) => `<div class="kpi ${cls || ''}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`;
  const card = (title, body) => `<section class="card"><h2>${esc(title)}</h2>${body}</section>`;

  // статусы свободной формы -> бейдж
  function bdg(status) {
    const s = String(status || '');
    let cls = 'todo';
    if (/установ|сделан|закрыт|реализован/i.test(s)) cls = 'done';
    else if (/установка|в работе|на исправлении|разработка|формирование|утверждение/i.test(s)) cls = 'wip';
    return `<span class="bdg ${cls}">${esc(s || '—')}</span>`;
  }

  // ---------- метаданные источников ----------
  if (R) R.meta = R.meta || {};
  const SOURCES = (R && R.meta.sources) || {};
  const srcDown = k => SOURCES[k] === 'unavailable';
  const emptyNote = (src, emptyText) => srcDown(src)
    ? `<p class="note">Данные недоступны — ${esc(SRC[src] || src)}: источник недоступен.</p>`
    : `<p class="note">${emptyText}</p>`;
  const TH = Object.assign({ pr_stale_days: 1, pr_critical_days: 2, task_stale_days: 2 }, (R && R.meta && R.meta.thresholds) || {});

  let personFilter = '';
  try { personFilter = localStorage.getItem('standup.person') || ''; } catch (e) {}
  let tab = 'overview';
  try { tab = localStorage.getItem('standup.tab') || 'overview'; } catch (e) {}
  if (tab === 'standup') tab = 'overview'; // прежнее имя вкладки

  function ageBadge(n, isWarn, isBad) {
    if (!isNum(n)) return '';
    const cls = isBad(n) ? 'bad' : isWarn(n) ? 'warn' : 'todo';
    return `<span class="bdg ${cls}">${n === 0 ? 'сегодня' : days(n)}</span>`;
  }
  function personLevel(p) {
    if (p.absent) return 'absent';
    const sig = (R.signals || []).filter(s => s.owner === p.name);
    if (sig.some(s => s.level === 'red')) return 'red';
    if (sig.some(s => s.level === 'yellow') || (p.flags || []).length) return 'yellow';
    return 'ok';
  }

  // ---------- шапка ----------
  function header() {
    const s = R.sprint || {};
    const level = LEVEL[R.status.level] || ['', ''];
    document.getElementById('ptitle').textContent = `Стендап · ${R.meta.team || 'команда'}`;
    const lp = document.getElementById('levelPill');
    lp.hidden = false; lp.textContent = `${level[0]} статус`; lp.className = `pill ${level[1]}`;
    const sp = document.getElementById('sprintPill');
    sp.hidden = false;
    if (srcDown('jira')) { sp.textContent = 'Данные недоступны — Jira'; sp.className = 'pill blocked'; }
    else if (!!(s.name || isNum(s.day))) {
      sp.textContent = `● ${s.name || 'Спринт идёт'}${isNum(s.day) && isNum(s.days_total) ? ` · день ${s.day}/${s.days_total}` : ''}`;
      sp.className = 'pill live';
    } else { sp.textContent = 'Нет активного спринта'; sp.className = 'pill blocked'; }
    const dots = Object.entries(SOURCES).map(([k, v]) => {
      const st = v === 'ok' ? ['ok', ''] : v === 'partial' ? ['partial', ' — частично'] : ['bad', ' — недоступен'];
      return `<span><span class="dot ${st[0]}"></span>${esc(SRC[k] || k)}${st[1]}</span>`;
    }).join('');
    document.getElementById('psub').innerHTML = `<span class="sources">${dots}</span>`;
    const g = R.meta.generated_at ? new Date(R.meta.generated_at) : null;
    document.getElementById('collected').textContent =
      g && !isNaN(g) ? `собрано ${g.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })} в ${g.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}${R.meta.generated_by ? ` · ${R.meta.generated_by}` : ''}` : (R.meta.generated_by || '');
  }

  // ---------- обзор ----------
  function viewOverview() {
    const sig = R.signals || [];
    const red = sig.filter(s => s.level === 'red').length, yellow = sig.length - red;
    const stalePrs = (R.prs || []).filter(p => isNum(p.idle_days) && p.idle_days >= TH.pr_critical_days).length;
    const badJobs = (R.tests.jobs || []).filter(j => j.state === 'failed_before_tests' || j.state === 'hung' || j.state === 'idle').length;
    const badLaunches = (R.tests.launches || []).filter(l => (l.failed > 0) || (l.broken > 0)).length;
    const cov = ((R.coverage || {}).projects || []).filter(c => isNum(c.pct));
    const covAvg = cov.length ? Math.round(cov.reduce((a, c) => a + c.pct, 0) / cov.length) : null;

    const s = R.sprint || {};
    const hasSprint = !!(s.name || isNum(s.day));
    const sprintSub = hasSprint
      ? [isNum(s.day) && isNum(s.days_total) ? `день ${s.day} из ${s.days_total}` : '', isNum(s.done_pct) ? `закрыто ${s.done_pct}%` : '', s.start || s.end ? `${fmtDate(s.start)}–${fmtDate(s.end)}` : ''].filter(Boolean).join(' · ')
      : (srcDown('jira') ? 'Jira недоступна' : 'Нет активного спринта');

    const [lvl] = LEVEL[R.status.level] || [''];
    let k = kpi('Статус', lvl, R.status.summary, R.status.level === 'red' ? 'bad' : R.status.level === 'yellow' ? 'warn' : 'ok');
    k += kpi('Спринт', hasSprint ? (s.name || 'идёт') : 'нет', sprintSub, s.risk ? 'warn' : '');
    k += kpi('Требует внимания', sig.length ? `${red} / ${yellow}` : '0', red ? 'красных сигналов — сначала они' : 'жёлтые — по ходу дня', red ? 'bad' : sig.length ? 'warn' : 'ok');
    k += kpi('Зависшие PR', stalePrs, `${(R.prs || []).length} открытых · без движения ≥ ${TH.pr_critical_days} дн.`, stalePrs ? 'bad' : 'ok');
    k += kpi('Проблемные джобы', badJobs || '0', 'упали / зависли / давно не запускались', badJobs ? 'warn' : 'ok');
    k += kpi('Красные лончи', badLaunches || '0', 'упавшие тесты в последнем прогоне', badLaunches ? 'warn' : 'ok');
    k += kpi('Покрытие (среднее)', covAvg == null ? '—' : `${covAvg}%`, cov.length ? `${cov.length} проектов` : 'нет данных', '');

    const hints = (R.meta.setup_hints || []).map(h => {
      const doc = safeUrl(h.doc_url);
      return `<div class="banner warn"><b>${esc(SRC[h.name] || h.name)} не подключён</b>: ${esc(h.reason)}. Данные по нему не собраны.${doc ? ` <a href="${esc(doc)}" target="_blank" rel="noopener">Как подключить</a>` : ''}</div>`;
    }).join('');
    const cls = R.status.level === 'red' ? 'bad' : R.status.level === 'yellow' ? 'warn' : 'info';
    const statusBanner = `<div class="banner ${cls}"><b>${esc(lvl)} статус:</b> ${esc(R.status.summary)}</div>`;
    const riskBanner = s.risk ? `<div class="banner warn"><b>Риск спринта:</b> ${esc(s.risk)}</div>` : '';
    const ready = (R.releases.ready_without_release || []);
    const readyBanner = ready.length ? `<div class="banner warn">Готово к выводу, но не в релизе: ${ready.map(x => `${link(x.url, esc(x.key))} ${esc(x.title)}${x.assignee ? ` (${esc(x.assignee)})` : ''}`).join(', ')}</div>` : '';

    const recs = (R.recommendations || []).map(r => `
      <div class="recg"><b>${esc(r.who)}</b><span>${esc(r.what)}</span><span class="muted">${esc(r.when)}</span><span class="why">${esc(r.why)}</span></div>`).join('');
    return `${hints}${statusBanner}${riskBanner}${readyBanner}<div class="kpis">${k}</div>` +
      goalCard() +
      card('Что делать', recs ? recs : '<p class="note">Рекомендаций нет.</p>');
  }

  // цель спринта — отдельной карточкой на обзоре (как в PO Cockpit)
  function goalCard() {
    const s = R.sprint || {};
    if (srcDown('jira')) return '';
    const goal = (s.goal || '').trim();
    const meta = [s.name, isNum(s.day) && isNum(s.days_total) ? `день ${s.day} из ${s.days_total}` : '',
      isNum(s.done_pct) ? `закрыто ${s.done_pct}%` : '', s.start || s.end ? `${fmtDate(s.start)}–${fmtDate(s.end)}` : '']
      .filter(Boolean).join(' · ');
    let body = goal ? `<div class="goal">${esc(goal)}</div>` : '<p class="note">Цель спринта в Jira не заполнена — сформулируйте на планировании.</p>';
    if (s.risk) body += `<div class="banner warn" style="margin:10px 0 0">${esc(s.risk)}</div>`;
    if (meta) body += `<p class="note">${esc(meta)}</p>`;
    return card('Цель спринта', body);
  }

  // ---------- спринт и команда ----------
  function viewTeam() {
    const s = R.sprint || {};
    const scope = s.scope_added || [];
    const hasSprint = !!(s.name || isNum(s.day));

    let sprintBody;
    if (srcDown('jira')) sprintBody = '<p class="note">Данные недоступны — Jira: источник недоступен.</p>';
    else if (!hasSprint) sprintBody = '<p class="note">Нет активного спринта.</p>';
    else {
      const timePct = isNum(s.day) && isNum(s.days_total) && s.days_total > 0 ? Math.min(100, Math.round(s.day / s.days_total * 100)) : null;
      const done = isNum(s.done_pct) ? Math.min(100, s.done_pct) : 0;
      sprintBody = `
        ${s.name ? `<div class="note" style="margin:0 0 8px">Спринт <b>${esc(s.name)}</b>${isNum(s.day) && isNum(s.days_total) ? ` · день ${s.day} из ${s.days_total}` : ''}${s.start || s.end ? ` · ${fmtDate(s.start)}–${fmtDate(s.end)}` : ''}</div>` : ''}
        ${(s.goal || '').trim() ? `<div class="goal">${esc(s.goal)}</div>` : '<p class="note">Цель спринта в Jira не заполнена.</p>'}
        <div class="progress" title="Зелёная полоса — закрыто SP, жёлтая отметка — прошедшее время спринта">
          <div class="done" style="width:${done}%"></div>${timePct != null ? `<div class="mark" style="left:${timePct}%"></div>` : ''}
        </div>
        <div class="legend">
          <span><i style="background:var(--ok)"></i>Закрыто ${isNum(s.done_pct) ? `${s.done_pct}%` : '—'}${isNum(s.sp_done) && isNum(s.sp_total) ? ` (${s.sp_done} из ${s.sp_total} SP)` : ''}</span>
          ${isNum(s.day) && isNum(s.days_total) ? `<span>день ${s.day} из ${s.days_total}</span>` : ''}
          ${s.start || s.end ? `<span>${fmtDate(s.start)}–${fmtDate(s.end)}</span>` : ''}
        </div>
        ${scope.length ? `<div class="note">Добавлено после старта: ${scope.map(x => `${link(x.url, esc(x.key))} ${esc(x.title)}`).join(', ')}</div>` : ''}
        ${s.risk ? `<div class="note"><b style="color:var(--warn)">Риск:</b> ${esc(s.risk)}</div>` : ''}`;
    }

    const persons = R.people.filter(p => !personFilter || p.name === personFilter);
    const rows = persons.map(p => {
      const trCls = !p.active.length && !p.absent ? ' class="row-bad"' : p.absent ? ' class="row-warn"' : '';
      const status = p.absent ? `<span class="bdg todo">${esc(p.absent.reason || 'отсутствует')} до ${fmtDate(p.absent.to)}</span>`
        : p.active.length ? `<span class="bdg wip">${p.active.length} в работе</span>`
        : '<span class="bdg bad">нет задач в работе</span>';
      const tasks = p.active.length
        ? p.active.map(t => {
            const note = [t.status && t.status !== 'В работе' ? t.status : '', isNum(t.days_no_move) && t.days_no_move > 0 ? days(t.days_no_move) : 'сегодня'].filter(Boolean).join(' · ');
            return `<div class="task">${link(t.url, esc(t.key), 'class="key" ')}<span class="t" title="${esc(t.title)}">${esc(t.title)}</span>${p.absent ? `<span class="bdg todo">${days(t.days_no_move)}</span>` : (isNum(t.days_no_move) && t.days_no_move >= TH.task_stale_days ? `<span class="bdg warn">${esc(note || 'без обновлений')}</span>` : '')}</div>`;
          }).join('')
        : '<span class="empty-work">Нет задач в работе</span>';
      const prs = (p.prs || []).map(x => link(x.url, `${esc(x.repo)}#${esc(x.id)}`)).join(', ');
      const flags = [
        ...(p.blockers || []).map(b => `Блокер: ${esc(b && typeof b === 'object' ? b.text : b)}`),
        ...(p.flags || []).map(f => String(f ?? ''))
          .filter(f => !(p.absent && f.startsWith('в отпуске')) && !(!p.active.length && f === 'нет задач в работе'))
          .map(esc)
      ].filter(Boolean);
      const own = (R.signals || []).filter(x => x.owner === p.name).length;
      const fallback = own ? `<div>${own} ${plural(own, 'сигнал', 'сигнала', 'сигналов')} в «Требует внимания»</div>` : (p.active.length ? '<span class="muted">Всё в порядке</span>' : '');
      return `<tr${trCls}>
        <td><b>${esc(p.name)}</b><div class="small muted">${esc(ROLE[p.role] || p.role)}${prs ? ` · PR ${prs}` : ''}</div></td>
        <td>${status}</td><td>${tasks}</td>
        <td class="small muted">${flags.join('<br>') || fallback}</td></tr>`;
    }).join('');

    return card('Спринт', sprintBody) +
      card('Кто чем занят', `<div style="margin-bottom:8px"><label class="small muted">Сотрудник
        <select id="person"><option value="">Вся команда</option>${R.people.map(p => `<option ${p.name === personFilter ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>
        <div class="tblscroll"><table>
        <tr><th>Участник</th><th>Статус</th><th>Задачи в работе</th><th>Блокеры и флаги</th></tr>
        ${rows}</table></div>`) +
      signalsCard();
  }

  // ---------- сигналы ----------
  function signalsCard() {
    const list = (R.signals || [])
      .filter(s => !personFilter || s.owner === personFilter)
      .sort((a, b) => (a.level === b.level ? (b.age_days || 0) - (a.age_days || 0) : a.level === 'red' ? -1 : 1));
    const red = list.filter(s => s.level === 'red').length;
    const body = list.length ? `<div class="timeline">${list.map(s => `
      <div class="t-item"><div class="t-date"><span class="bdg ${s.level === 'red' ? 'bad' : 'warn'}">${s.level === 'red' ? 'красный' : 'жёлтый'}</span>${isNum(s.age_days) ? `<div>${days(s.age_days)}</div>` : ''}</div>
        <div><b>${esc(s.owner)}</b> — ${esc(s.text)}
          <div style="margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${safeUrl(s.url) ? `<a href="${esc(safeUrl(s.url))}">открыть</a>` : ''}
          <button class="btn copy" type="button" data-text="${esc(s.reminder)}">Скопировать напоминание</button></div>
        </div></div>`).join('')}</div>` : '<p class="note">Сигналов нет — можно идти работать.</p>';
    return `<section class="card"><h2>Требует внимания <span class="count">${red} красных, ${list.length - red} жёлтых</span></h2>${body}</section>`;
  }

  // ---------- PR ----------
  function viewPrs() {
    const list = (R.prs || []).slice().sort((a, b) => (b.idle_days || 0) - (a.idle_days || 0));
    const build = { ok: ['done', 'сборка ок'], failed: ['bad', 'сборка упала'], running: ['todo', 'собирается'] };
    const srcNote = srcDown('bitbucket')
      ? '<div class="banner bad">PR не собраны — Bitbucket: источник недоступен.</div>'
      : (SOURCES.bitbucket === 'partial' ? '<div class="banner warn">PR собраны частично — Bitbucket ответил не по всем репозиториям.</div>' : '');
    if (!list.length) return srcNote + card('Pull request’ы', '<p class="note">Открытых PR нет.</p>');
    const rows = list.map(p => {
      const turn = p.whose_turn === 'reviewers' ? `ревьюеры: ${(p.reviewers || []).map(esc).join(', ')}`
        : p.whose_turn === 'author' ? `автор: ${esc(p.author)}` : '<span class="muted">неясно</span>';
      const [bc, bt] = build[p.build] || ['todo', esc(p.build || 'нет данных')];
      return `<tr>
        <td>${link(p.url, `${esc(p.repo)}#${esc(p.id)}`)} ${esc(p.title)}<div class="small muted">${esc(p.author)}${p.jira_key ? ` · ${esc(p.jira_key)}` : ' · <span style="color:var(--warn)">нет Jira-ключа</span>'}</div></td>
        <td>${turn}</td>
        <td>${ageBadge(p.idle_days, n => n >= TH.pr_stale_days, n => n >= TH.pr_critical_days)}</td>
        <td class="small muted">${esc(p.last_human_activity)}</td>
        <td><span class="bdg ${bc}">${bt}</span></td></tr>`;
    }).join('');
    return srcNote + card('Pull request’ы', `<div class="tblscroll"><table>
      <tr><th>PR</th><th>Чей ход</th><th>Без движения</th><th>Последнее действие</th><th>Сборка</th></tr>
      ${rows}</table></div>`);
  }

  // ---------- релизы ----------
  // Открытый релиз не «просрочен», а стоит на стадии конвейера: план — это план, а не дедлайн.
  function relCard(r) {
    const linked = r.linked || [], issues = (r.issues || []).filter(x => x !== 'нет связанных задач');
    const meta = [r.planned_date ? `план ${fmtDate(r.planned_date)}` : '',
      isNum(r.days_no_move) ? `без движения ${days(r.days_no_move)}` : ''].filter(Boolean).join(' · ');
    return `<div class="relcard"><div><span class="k">${link(r.url, esc(r.key))}</span> ${esc(r.title)}</div>
      <small>${meta || 'даты нет'}${linked.length ? '' : ' · ничего не связано'}</small>
      ${issues.length ? `<div class="issues">${issues.map(esc).join('; ')}</div>` : ''}</div>`;
  }

  function viewReleases() {
    const rel = R.releases || {};
    const type = R.meta.release_type ? ` <span class="muted small">${esc(R.meta.release_type)}</span>` : '';
    const open = rel.upcoming || [], done = rel.past || [];
    const stages = rel.stages || [];
    const doneStatus = rel.done_status || '';

    // конвейер: одна колонка на стадию из конфига + колонка «вне конвейера», если статус не совпал
    let pipeline;
    if (srcDown('jira')) pipeline = '<p class="note">Данные недоступны — Jira: источник недоступен.</p>';
    else if (!stages.length) pipeline = emptyNote('jira', 'Стадии релиза не заданы в techlead.yaml (release.statuses).');
    else {
      const outside = open.filter(r => !stages.includes(r.status));
      const cols = [...stages, ...(outside.length ? [null] : [])].map((stage, i) => {
        const items = stage === null ? outside : open.filter(r => r.status === stage);
        const head = stage === null ? 'статус вне конвейера' : stage;
        return `<div class="stagecol"><h4>${esc(head)}<span class="count">${items.length}</span></h4>` +
          (items.map(relCard).join('') || '<div class="note">—</div>') + '</div>';
      }).join('');
      pipeline = `<div class="cols">${cols}</div>`;
      const moved = open.filter(r => r.planned_date);
      if (moved.length) pipeline += `<p class="note">Плановая дата у ${moved.length} уже прошла — это не «просрочка»: релиз открыт и стоит на своей стадии. Смотрите, сколько он там не двигается.</p>`;
    }

    const doneRows = done.map(r => `<tr><td>${link(r.url, esc(r.key))}</td><td>${esc(r.title)}</td>
      <td>${r.planned_date ? fmtDate(r.planned_date) : '—'}</td><td>${r.closed_date ? fmtDate(r.closed_date) : '—'}</td>
      <td>${bdg(r.status)}</td></tr>`).join('');
    const doneCard = `<section class="card"><h2>Выведено на ПРОМ${doneStatus ? ` <span class="muted small">${esc(doneStatus)}</span>` : ''} <span class="count">${done.length}</span></h2>` +
      (doneRows
        ? `<div class="tblscroll"><table><tr><th>Релиз</th><th>Название</th><th>План</th><th>Факт</th><th>Статус</th></tr>${doneRows}</table></div>`
        : emptyNote('jira', 'Нет.')) + '</section>';

    const ready = (rel.ready_without_release || []);
    const readyBanner = ready.length ? `<div class="banner warn">Готово к выводу, но не в релизе: ${ready.map(x => `${link(x.url, esc(x.key))} ${esc(x.title)}${x.assignee ? ` (${esc(x.assignee)})` : ''}`).join(', ')}</div>` : '';
    // заголовок собирается вручную: внутри тип релиза как html-спан
    return `<section class="card"><h2>Конвейер релизов${type} <span class="count">${open.length} в работе</span></h2>${pipeline}</section>` +
      doneCard + readyBanner;
  }

  // ---------- автотесты ----------
  function viewAutotests() {
    const t = R.tests || {};
    const jenkinsDown = SOURCES.jenkins === 'unavailable';
    const jobs = jenkinsDown
      ? '<p class="note">Состояние джоб Jenkins неизвестно — источник недоступен.</p>'
      : (t.jobs || []).map(j => {
          const [label, cls] = JOB_STATE[j.state] || [j.state, 'todo'];
          return `<li>${link(j.url, esc(j.name))} <span class="bdg ${cls}">${esc(label)}</span>${j.last_run ? ` <span class="muted small">${fmtDate(j.last_run)}</span>` : ''}</li>`;
        }).join('') || '<p class="note">Джоб нет.</p>';
    const n = v => (isNum(v) ? v : '—');
    const launches = (t.launches || []).map(l => {
      const bad = (l.failed || 0) + (l.broken || 0);
      return `<tr><td>${link(l.url, esc(l.name))}<div class="small muted">${esc(l.project)}</div></td>
        <td class="num">${n(l.passed)}</td><td class="num" style="color:${bad ? 'var(--bad)' : 'inherit'}">${n(l.failed)}</td><td class="num">${n(l.broken)}</td><td class="num muted">${n(l.skipped)}</td>
        <td><span class="bdg ${bad ? 'bad' : 'done'}">${bad ? 'красный' : 'зелёный'}</span></td></tr>`;
    }).join('');
    const fails = (t.failures || []).map(f => `<tr><td><span class="sig">${esc(f.test)}</span></td>
      <td>${f.is_new ? '<span class="bdg bad">новое</span>' : ''} ${f.flaky_rate ? `<span class="bdg warn">flaky ${Math.round(f.flaky_rate * 100)}%</span>` : ''}</td>
      <td class="small">${f.short_cause ? esc(f.short_cause) : '<span class="muted">не разобрано — запустите /tests</span>'}</td></tr>`).join('');
    const cov = ((R.coverage || {}).projects || []).map(c => {
      const color = c.pct < c.target ? 'var(--warn)' : 'var(--ok)';
      const d = c.delta_prev > 0 ? `+${c.delta_prev}` : c.delta_prev;
      return `<div class="cov"><span>${esc(c.name)}</span>
        <span class="bar" title="${c.automated} из ${c.total} кейсов, цель ${c.target}%"><i style="width:${c.pct}%;--cv:${color}"></i><s style="left:${c.target}%"></s></span>
        <span><b>${c.pct}%</b> <span class="small" style="color:${c.delta_prev < 0 ? 'var(--bad)' : 'var(--ok)'}">${d}</span></span></div>`;
    }).join('');
    return card('Лончи TestOps', launches ? `<div class="tblscroll"><table><tr><th>Последний лонч</th><th class="num">Прошло</th><th class="num">Упало</th><th class="num">Broken</th><th class="num">Пропущено</th><th></th></tr>${launches}</table></div>` : emptyNote('testops', 'Лончей нет.')) +
      card('Падения', fails ? `<div class="tblscroll"><table>${fails}</table></div>` : emptyNote('testops', 'Падений нет.')) +
      card('Покрытие автотестами', cov || emptyNote('testops', 'Данных о покрытии нет.')) +
      card('Джобы Jenkins', `<ul class="clean">${jobs}</ul>`);
  }

  // ---------- разбор падений ----------
  function viewTests() {
    if (!T) return card('Разбор падений', '<p class="note">Разбора падений ещё нет. Запустите <b>/tests</b> — агент сгруппирует падения по причинам и сохранит разбор сюда.</p>');
    const cat = { 'окружение': 'todo', 'баг продукта': 'bad', 'flaky': 'warn', 'ошибка теста': 'warn', 'данные': 'todo' };
    const clusters = T.clusters || [], tm = T.meta || {};
    const total = clusters.reduce((a, c) => a + (c.count || 0), 0);
    const notes = (tm.notes || []).length ? `<ul class="small muted" style="margin:0 0 12px;padding-left:18px">${tm.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    const bug = b => !b ? ''
      : typeof b === 'string' ? `<span class="small muted">${esc(b)}</span>`
      : link(b.url, esc(b.key || 'баг'));
    const items = clusters.map((c, i) => `<details class="cluster" ${i === 0 ? 'open' : ''}>
      <summary><div><span class="bdg ${cat[c.category] || 'todo'}">${esc(c.category)}</span> <b>${c.count} ${plural(c.count, 'тест', 'теста', 'тестов')}</b><div class="sig" style="margin-top:4px">${esc(c.signature)}</div></div>
        <div>${bug(c.jira_bug) || (c.suggested_bug ? '<span class="bdg warn">бага нет</span>' : '')}</div></summary>
      <div class="body">
        <p style="margin:0 0 8px">${esc(c.cause)}</p>
        ${c.jenkins_log_excerpt ? `<pre>${esc(c.jenkins_log_excerpt)}</pre>` : ''}
        ${c.suggested_bug ? `<div class="bugdraft"><b>Черновик бага:</b> ${esc(c.suggested_bug.title)}<div class="small muted">${esc(c.suggested_bug.description)}</div>
          <button class="btn copy" style="margin-top:8px" type="button" data-text="${esc(c.suggested_bug.title + '\n\n' + c.suggested_bug.description)}">Скопировать черновик</button></div>` : ''}
        <div class="small" style="margin-top:8px">${(c.tests || []).map(t => `<div>${link(t.url, esc(t.name), 'class="sig" ')}</div>`).join('')}</div>
      </div></details>`).join('');
    const head = `<h2>Разбор падений <span class="count">${total} ${plural(total, 'падение', 'падения', 'падений')} · ${clusters.length} ${plural(clusters.length, 'группа', 'группы', 'групп')}</span>${(tm.launches || []).length ? ` <span class="small muted">${(tm.launches || []).map(esc).join(', ')} · ${esc(tm.generated_by)}</span>` : ''}</h2>`;
    return `<section class="card">${head}${notes}${items || '<p class="note">Кластеров нет.</p>'}</section>`;
  }

  // ---------- сборка страницы ----------
  const TABS = [
    ['overview', 'Обзор'],
    ['team', 'Спринт и команда'],
    ['prs', 'PR'],
    ['releases', 'Релизы'],
    ['autotests', 'Автотесты'],
    ['tests', 'Разбор падений']
  ];
  const VIEWS = { overview: viewOverview, team: viewTeam, prs: viewPrs, releases: viewReleases, autotests: viewAutotests, tests: viewTests };

  function initFrame() {
    const tabs = document.getElementById('tabs');
    tabs.hidden = false;
    tabs.innerHTML = TABS.map(([id, label]) => `<button class="tab${id === tab ? ' active' : ''}" data-v="${id}" aria-selected="${id === tab}">${label}</button>`).join('');
    tabs.addEventListener('click', e => {
      const b = e.target.closest('.tab'); if (!b) return;
      tab = b.dataset.v;
      tabs.querySelectorAll('.tab').forEach(t => { t.classList.toggle('active', t === b); t.setAttribute('aria-selected', t === b); });
      try { localStorage.setItem('standup.tab', tab); } catch (x) {}
      content.innerHTML = `<section class="view active">${(VIEWS[tab] || viewOverview)()}</section>`;
    });
  }

  if (!R) {
    content.innerHTML = '<section class="card"><h2>Отчёта ещё нет — запустите /standup</h2><p>Запустите <b>/standup</b> в GigaCode из папки команды — страница обновится после генерации <code>reports/latest.js</code>.</p></section>';
  } else {
    header();
    initFrame();
    const gen = R.meta.generated_at ? new Date(R.meta.generated_at) : null;
    foot.innerHTML = `<span>Снимок: <code>reports/latest.js</code>${gen && !isNaN(gen) ? ` от ${gen.toLocaleString('ru-RU')}` : ''}</span>` +
      `<span>Фильтры и вкладка запоминаются локально</span>`;
    content.innerHTML = `<section class="view active">${(VIEWS[tab] || viewOverview)()}</section>`;
  }

  // копирование и фильтр по сотруднику
  document.getElementById('app').addEventListener('click', e => {
    const cp = e.target.closest('.copy');
    if (!cp) return;
    const done = () => { const old = cp.textContent; cp.textContent = 'Скопировано'; cp.classList.add('copied'); setTimeout(() => { cp.textContent = old; cp.classList.remove('copied'); }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(cp.dataset.text).then(done, () => fallbackCopy(cp.dataset.text, done));
    else fallbackCopy(cp.dataset.text, done);
  });
  document.getElementById('app').addEventListener('change', e => {
    if (e.target.id !== 'person') return;
    personFilter = e.target.value;
    try { localStorage.setItem('standup.person', personFilter); } catch (x) {}
    content.innerHTML = `<section class="view active">${(VIEWS[tab] || viewOverview)()}</section>`;
  });
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (x) {} ta.remove();
  }
})();
</script>
</body>
</html>
